# 放到你 fork 的仓库里：.github/workflows/ios-unsigned.yml
# 手动触发（Actions 页面点 Run workflow），产出无签名 Hapi-unsigned.ipa 作为 artifact
name: ios-unsigned-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-unsigned.yml'

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ios/Hapi.xcodeproj \
            -scheme Hapi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hapi.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/Hapi.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Hapi-unsigned.ipa Payload
          ls -lh Hapi-unsigned.ipa
          unzip -l Hapi-unsigned.ipa | head -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: Hapi-unsigned-ipa
          path: Hapi-unsigned.ipa
          retention-days: 30

